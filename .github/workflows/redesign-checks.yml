name: Redesign checks
on:
  push:
    branches: [redesign/industrial-mobile]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Platform and syntax checks
        run: node --test test/platform.test.js
      - name: Install isolated browser test tools
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Responsive interface checks
        run: node test/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rigrx-design-screenshots
          path: test-results/
          retention-days: 14
