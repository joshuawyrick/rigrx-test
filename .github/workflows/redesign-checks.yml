name: Redesign checks
on:
  push:
    branches: [redesign/industrial-mobile]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rigrx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test test/selection.test.js
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/rigrx_test
      - run: node --test test/release.test.js
        env:
          RELEASE_DATABASE_URL: postgres://postgres:test@localhost:5432/rigrx_test
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Platform and syntax checks
        run: node --test test/platform.test.js
      - name: Install isolated browser test tools
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Full application and fleet checks
        run: node --test test/release.test.js
        env:
          RUN_BROWSER: '1'
      - name: Responsive interface checks
        run: node test/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rigrx-design-screenshots
          path: test-results/
          retention-days: 14
